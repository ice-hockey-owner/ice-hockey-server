services:
  - type: web
    name: ice-hockey-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: ice-hockey-data
      mountPath: /var/data
      sizeGB: 1
